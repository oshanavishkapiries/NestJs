<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExcaliPlayer - Interactive Board with Text & Drawings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Full Screen Board Workspace -->
  <div class="board-workspace" id="boardWorkspace">
    <!-- Full-Screen Interactive Drawing Canvas -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Resizable Video Widgets Container Layer -->
    <div class="widgets-layer" id="widgetsLayer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay hidden" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Preloading animation frames (0%)...</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="preloadProgressFill"></div>
      </div>
    </div>

    <!-- 1. Right-Click Floating Context Menu Control Panel -->
    <div class="context-menu-panel hidden" id="contextMenuPanel">
      <div class="context-header">
        <span>Control Panel</span>
        <div class="save-status-pill" id="saveStatus" title="Synced to JSON">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 16h5v5"></path>
          </svg>
          <span class="status-dot"></span>
        </div>
      </div>

      <!-- Tools Section -->
      <div class="setting-section">
        <label class="setting-label">Board Tools</label>
        <div class="tool-group">
          <button id="toolSelect" class="tool-btn active" title="Select / Move Mode">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path></svg>
          </button>
          <button id="toolPen" class="tool-btn" title="Pen Tool">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
          </button>
          <button id="toolText" class="tool-btn" title="Text Tool (Click canvas to add text)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"></path></svg>
          </button>
          <button id="toolEraser" class="tool-btn" title="Eraser Tool">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L21 10C21.5 10.5 21.5 11.5 21 12L14 19"></path></svg>
          </button>
        </div>
      </div>

      <!-- Color Palette -->
      <div class="setting-section">
        <label class="setting-label">Colors</label>
        <div class="color-palette" id="colorPalette">
          <button class="color-swatch active" data-color="#ef4444" style="background:#ef4444;"></button>
          <button class="color-swatch" data-color="#eab308" style="background:#eab308;"></button>
          <button class="color-swatch" data-color="#22c55e" style="background:#22c55e;"></button>
          <button class="color-swatch" data-color="#3b82f6" style="background:#3b82f6;"></button>
          <button class="color-swatch" data-color="#a855f7" style="background:#a855f7;"></button>
          <button class="color-swatch" data-color="#ffffff" style="background:#ffffff;"></button>
          <button class="color-swatch" data-color="#06b6d4" style="background:#06b6d4;"></button>
        </div>
      </div>

      <!-- Stroke / Text Size -->
      <div class="setting-section">
        <label class="setting-label">Size / Font Size</label>
        <div class="stroke-sizes" id="strokeSizes">
          <button class="stroke-btn" data-width="2" title="Small Font / Thin Pen">
            <span class="dot-sm"></span>
          </button>
          <button class="stroke-btn active" data-width="4" title="Medium Font / Medium Pen">
            <span class="dot-md"></span>
          </button>
          <button class="stroke-btn" data-width="8" title="Large Font / Thick Pen">
            <span class="dot-lg"></span>
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="setting-section actions-row">
        <button id="btnUndo" class="btn btn-action" title="Undo Last Item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
          <span>Undo</span>
        </button>
        <button id="btnClearDrawings" class="btn btn-action btn-danger" title="Clear Board Items">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          <span>Clear Board</span>
        </button>
      </div>
    </div>

    <!-- 2. Right-Center Edge Docked Arrow Button -->
    <button id="btnToggleAnimPanel" class="anim-toggle-btn" title="Toggle Animation Drawer">
      <svg id="arrowIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- 3. Slide-out Right Animation Drawer -->
    <aside class="anim-drawer" id="animDrawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Available Animations</span>
        </div>
        <button id="btnCloseDrawer" class="btn-close-drawer" title="Close Drawer">✕</button>
      </div>

      <!-- Animation Cards List -->
      <div class="cards-list" id="animCardsList"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
