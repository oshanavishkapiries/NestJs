<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExcaliPlayer - GTA-Style Radial Selector Wheel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Full Screen Board Workspace -->
  <div class="board-workspace" id="boardWorkspace">
    <!-- Full-Screen Interactive Drawing Canvas -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Resizable Video Widgets Container Layer -->
    <div class="widgets-layer" id="widgetsLayer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay hidden" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Preloading animation frames (0%)...</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="preloadProgressFill"></div>
      </div>
    </div>

    <!-- 1. GTA V Style Expanding Radial Selector Wheel -->
    <div class="gta-radial-wheel hidden" id="gtaRadialWheel">
      <!-- Dynamic SVG Canvas for Primary Ring + Outer Expanded Sub-Menu Arcs -->
      <svg class="wheel-svg-bg" viewBox="0 0 440 440" id="wheelSvgBg"></svg>

      <!-- Center Hub (100% EMPTY Hole) -->
      <div class="wheel-empty-center"></div>

      <!-- Primary Categories Icons Layer -->
      <div class="wheel-primary-icons" id="wheelPrimaryIcons"></div>

      <!-- Outer Expanded Sub-Menu Items Overlay -->
      <div class="wheel-submenu-container" id="wheelSubmenuContainer"></div>
    </div>

    <!-- 2. Right-Center Edge Docked Arrow Button -->
    <button id="btnToggleAnimPanel" class="anim-toggle-btn" title="Toggle Animation Drawer">
      <svg id="arrowIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- 3. Slide-out Right Animation Drawer -->
    <aside class="anim-drawer" id="animDrawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Available Animations</span>
        </div>
        <button id="btnCloseDrawer" class="btn-close-drawer" title="Close Drawer">✕</button>
      </div>

      <!-- Animation Cards List -->
      <div class="cards-list" id="animCardsList"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
